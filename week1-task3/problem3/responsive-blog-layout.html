<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive Blog Layout</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
        }

        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        
        main {
            padding: 20px;
        }

       
        .blog-container {
            display: flex;
            flex-wrap: wrap;          
            gap: 20px;
        }

       
        .blog-card {
            background-color: #f5baba;
            border: 1px solid #f4a2a2;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            flex: 1 1 300px;          
        }

        .blog-card h2 {
            margin-top: 0;
            font-size: 20px;
            color: #222;
        }

        .blog-card p {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
        }

        .blog-card button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .blog-card button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>My Tech Blog</h1>
</header>

<main>
    <div class="blog-container">

        <div class="blog-card">
            <h2>HTML Semantics</h2>
            <p>Understand how semantic HTML improves accessibility and SEO.</p>
            <button>Read More</button>
        </div>

        <div class="blog-card">
            <h2>CSS Flexbox</h2>
            <p>Learn how Flexbox helps build responsive layouts easily.</p>
            <button>Read More</button>
        </div>

        <div class="blog-card">
            <h2>Responsive Design</h2>
            <p>Discover techniques for building mobile-friendly websites.</p>
            <button>Read More</button>
        </div>

    </div>
</main>

</body>
</html>
