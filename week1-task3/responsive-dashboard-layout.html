<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
}


.dashboard {
    display: flex;
    min-height: 100vh;
}


.sidebar {
    width: 220px;
    background-color: #2c3e50;
    color: white;
    padding: 1.5rem;
}

.sidebar h2 {
    margin-bottom: 1.5rem;
}

.sidebar ul {
    list-style: none;
}

.sidebar ul li {
    margin-bottom: 1rem;
}

.sidebar ul li a {
    text-decoration: none;
    color: white;
    font-size: 0.95rem;
}

.sidebar ul li a:hover {
    text-decoration: underline;
}


.main-content {
    flex: 1;
    padding: 2rem;
}


.cards {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
}


.card {
    background-color: white;
    border: 1px solid #ddd;
    padding: 1.5rem;
    flex: 0 1 calc(33.333% - 1rem);
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

.card h3 {
    margin-bottom: 0.8rem;
    color: #333;
}

.card p {
    color: #555;
    font-size: 0.9rem;
}


@media (max-width: 992px) {
    .card {
        flex: 1 1 calc(50% - 1rem);
    }
}


@media (max-width: 768px) {

    .dashboard {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
    }

    .cards {
        flex-direction: column;
    }

    .card {
        flex: 1 1 100%;
    }
}

</style>
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <h1>Dashboard Overview</h1>

        <div class="cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1,245 registered users</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>₹75,000 this month</p>
            </div>

            <div class="card">
                <h3>New Orders</h3>
                <p>320 new orders received</p>
            </div>

            <div class="card">
                <h3>Pending Tasks</h3>
                <p>12 tasks require attention</p>
            </div>
        </div>
    </main>

</div>

</body>
</html>
