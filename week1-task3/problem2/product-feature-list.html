<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Feature List</title>

    <style>
        
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #7afc9f;
        }

       
        .feature-section {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 5%;
        }

        
        h2 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 25px;
            color: #222222;
            letter-spacing: 1px;
        }

        
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        
        .feature-list li {
            background-color: #eef3ff;
            color: #333333;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #cdd8ff;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

      
        .feature-list li:hover {
            background-color: #95b0f3;
            color: rgb(79, 57, 29);
            transform: translatex(-10px);
        }
    </style>
</head>
<body>

    <section class="feature-section">
        <h2>Product Features</h2>

        <ul class="feature-list">
            <li>Fast and responsive performance</li>
            <li>Clean and user-friendly interface</li>
            <li>Secure data handling</li>
            <li>Cross-device compatibility</li>
            <li>Easy customization options</li>
        </ul>
    </section>

</body>
</html>
