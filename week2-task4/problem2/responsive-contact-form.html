<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- IMPORTANT for responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Responsive Contact Form</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Contact Form</h3>

                    <form class="row g-3">

                        <!-- Full Name -->
                        <div class="col-12 col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control bg-primary" required>
                        </div>

                        <!-- Email -->
                        <div class="col-12 col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control bg-primary" required>
                        </div>

                        <!-- Phone -->
                        <div class="col-12 col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control bg-primary" required>
                        </div>

                        <!-- Subject -->
                        <div class="col-12 col-md-6">
                            <label class="form-label">Subject</label>
                            <input type="text" class="form-control bg-primary" required>
                        </div>

                        <!-- Message -->
                        <div class="col-12">
                            <label class="form-label">Message</label>
                            <textarea class="form-control bg-primary" rows="4" required></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="col-12 text-center">
                            <button type="submit" class="btn btn-primary px-4">Submit</button>
                            <button type="reset" class="btn btn-outline-secondary px-4">Reset</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
