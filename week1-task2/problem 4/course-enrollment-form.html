<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Enrollment Form</title>
</head>
<body>

    <h1>Course Enrollment Form</h1>

    <!-- Enrollment Progress -->
    <section>
        <label for="progress">Enrollment Completion:</label><br>
        <progress id="progress" value="60" max="100"></progress>
        <span>60%</span>
    </section>

    <br>

    <form method="post">

        <!-- Email -->
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <!-- Course Selection using datalist -->
        <label for="course">Select Course:</label><br>
        <input  type="text" id="course" name="course" list="course-list" required>

        <datalist id="course-list">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
            <option value="Python">
            <option value="Java Full Stack">
        </datalist>
        <br><br>

        <!-- Skill Level using meter -->
        <label>Skill Level:</label><br>
        Beginner
        <meter min="0" max="100" low="30" high="70" optimum="90" value="50"></meter>
        Advanced
        <br><br>

        <!-- Experience using range -->
        <label for="experience">Experience Level:</label><br>
        <input type="range" id="experience" name="experience" min="0" max="10">
        <br><br>

        <!-- Age -->
        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" min="18" max="60" required>
        <br><br>

        <!-- Submit -->
        <input type="submit" value="Enroll Now">

    </form>

</body>
</html>
