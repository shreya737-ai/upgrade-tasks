<!DOCTYPE html>
<html>
<head>
    <title>Student Feedback Form</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }
        .container{
            width:400px;
            margin:50px auto;
            background:#fff;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
        input, select, textarea{
            width:100%;
            padding:8px;
            margin:8px 0;
        }
        button{
            padding:10px;
            width:100%;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }
        .message{
            margin-top:15px;
            font-weight:bold;
        }
        .error{
            color:red;
        }
        .success{
            color:green;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Feedback Form</h2>

    <form id="feedbackForm">
        <input type="text" id="name" placeholder="Enter your Name">
        <input type="email" id="email" placeholder="Enter your Email">

        <select id="rating">
            <option value="">Select Course Rating</option>
            <option value="Excellent">Excellent</option>
            <option value="Good">Good</option>
            <option value="Average">Average</option>
            <option value="Poor">Poor</option>
        </select>

        <textarea id="comments" placeholder="Enter your Comments"></textarea>

        <button type="button" id="submitBtn">Submit</button>
    </form>

    <!-- Message will appear here -->
    <div id="formMessage" class="message"></div>
</div>

<script>
    $(document).ready(function(){

        $("#submitBtn").click(function(){

            // Capture values using jQuery selectors
            var name = $("#name").val().trim();
            var email = $("#email").val().trim();

            // Validation
            if(name === "" || email === ""){
                $("#formMessage")
                    .removeClass("success")
                    .addClass("error")
                    .text("⚠ Please enter both Name and Email.");
            }
            else{
                $("#formMessage")
                    .removeClass("error")
                    .addClass("success")
                    .text("✅ Thank you! Your feedback has been submitted successfully.");

                // Clear form fields
                $("#feedbackForm")[0].reset();
            }

        });

    });
</script>

</body>
</html>
