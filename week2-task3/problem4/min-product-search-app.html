<!DOCTYPE html>
<html>
<head>
    <title>Mini Product Search App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .container {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            margin-bottom: 5px;
            background: #eee;
            border-radius: 4px;
            cursor: pointer;
        }

        .no-results {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Product Search</h2>
    <input type="text" id="searchInput" placeholder="Search products...">
    <ul id="productList"></ul>
    <p id="noResults" class="no-results" style="display:none;">
        No Results Found
    </p>
</div>

<script>
    // STATE
    const state = {
        products: [
            "Laptop",
            "Smartphone",
            "Headphones",
            "Keyboard",
            "Mouse",
            "Monitor",
            "Tablet",
            "Camera"
        ],
        filteredProducts: []
    };

    const searchInput = document.getElementById("searchInput");
    const productList = document.getElementById("productList");
    const noResults = document.getElementById("noResults");

    // MODULE 1: Render Products
    function renderProducts(products) {
        productList.innerHTML = "";

        if (products.length === 0) {
            noResults.style.display = "block";
            return;
        }

        noResults.style.display = "none";

        products.forEach(product => {
            const li = document.createElement("li");
            li.textContent = product;
            productList.appendChild(li);
        });
    }

    // MODULE 2: Filter Products
    function filterProducts(query) {
        state.filteredProducts = state.products.filter(product =>
            product.toLowerCase().includes(query.toLowerCase())
        );

        renderProducts(state.filteredProducts);
    }

    // MODULE 3: Handle Product Click (Event Delegation Example)
    function handleProductClick(e) {
        if (e.target.tagName === "LI") {
            alert("You selected: " + e.target.textContent);
        }
    }

    // EVENT LISTENERS
    searchInput.addEventListener("input", function(e) {
        filterProducts(e.target.value);
    });

    // Event Delegation on UL
    productList.addEventListener("click", handleProductClick);

    // INITIAL RENDER
    renderProducts(state.products);

</script>

</body>
</html>
