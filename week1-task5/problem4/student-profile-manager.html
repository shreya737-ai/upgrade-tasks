<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student profile manager</title>
</head>
<body>
    <h1>Student Profile</h1>
    <div>
        <p>Name: <span id="name"></span></p>
        <p>Roll No: <span id="rollno"></span></p>
        <p>Marks: <span id="marks"></span></p>
    </div>
     <button id="update">update marks</button>
    <script>
        const studentProfile = {
            name: "shreya",
           rollno: 22,
            marks: 85
        };
        let name=document.getElementById('name');
        let rollno=document.getElementById('rollno');       
        let marks=document.getElementById('marks');
        
        function UpdateStudentProfile(){
            name.innerHTML=studentProfile.name;
            rollno.innerHTML=studentProfile.rollno;
            marks.innerHTML=studentProfile.marks;
        }
        document.getElementById('update').addEventListener('click', function(){
            const newMarks = prompt("Enter new marks:");
            updateMarks(newMarks);
        });
        UpdateStudentProfile();
        function updateMarks(newMarks){
            studentProfile.marks=newMarks;
            UpdateStudentProfile();
        }
    </script>
</body>
</html>
