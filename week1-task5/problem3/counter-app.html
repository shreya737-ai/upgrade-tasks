<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App with scope control</title>
    <style>
       button,p{
           display: inline-block;
       }
    </style>
</head>
<body>
    
    <button id="incrmtBtn">Increment</button>
    <p id="counterDisplay">0</p>
    <button id="resetbtn">reset</button>
    

    <script>
        const incrmtBtn = document.getElementById('incrmtBtn');
        const resetBtn = document.getElementById('resetbtn');
        const counterDisplay = document.getElementById('counterDisplay');
        incrmtBtn.addEventListener('click', function () {
            counterDisplay.innerHTML=parseInt(counterDisplay.innerHTML) + 1;
        });
        resetBtn.addEventListener('click', function () {
            counterDisplay.innerHTML=0;
        });

    </script>
</body>
</html>
